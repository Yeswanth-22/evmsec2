spring.application.name=EVMBackend
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evmdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
# Use MySQL8 dialect for modern MySQL/Aurora/MySQL 8+ compatibility
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:defaultVeryLongJwtSecretKeyThatIsAtLeast32BytesLong_for_dev_only}
# expiration in milliseconds (default ~33 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:120000000}

# =========================
# GOOGLE OAUTH
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# =========================
# FRONTEND
# =========================
app.oauth2.frontend-redirect-url=${FRONTEND_REDIRECT_URL:http://localhost:5173}

# =========================
# MAIL
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# APP MAIL
# =========================
app.mail.from=${MAIL_FROM:}
app.otp.ttl-ms=${OTP_TTL_MS:300000}
app.otp.resend-cooldown-ms=${OTP_RESEND_COOLDOWN_MS:60000}